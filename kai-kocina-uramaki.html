<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="description" content="Uramaki Filadélfia do Kai Kocina — salmão, cream cheese, nori e arroz. Peça pelo iFood.">
<title>Kai Kocina — Uramaki Filadélfia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* VOICE    silêncio japonês, luxo contido: poucas palavras, muita luz, nenhum ruído.
   IDEA     vitrine noturna de estúdio: uma única peça suspensa sob luz de recorte, um cartaz japonês que respira.
   PICTURE  o uramaki real, extrudado em 3D a partir da foto, flutua e gira; abre em camadas como vista explodida.
   COLOUR   tinta quase preta, marinho da marca no kanji, azul-gelo do logo na ação, salmão como única nota quente.
   TYPE/LAYOUT  Shippori Mincho B1 + Zen Kaku Gothic New; tela única: texto à esquerda e peça à direita, empilhado no celular. */
:root{
  color-scheme:dark;
  --bg:#06080b;--ink:#eef1f4;--mute:rgba(238,241,244,.66);--faint:rgba(238,241,244,.4);
  --ice:#c9e7fb;--ice-ink:#071321;--salmon:#f2895c;
  --display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --cx:66vw;--cy:50vh;--r:30vh;--lx:46%;--ly:38%;
  --pad-x:max(clamp(22px,4.2vw,68px),env(safe-area-inset-left));
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* ——— cenário ——— */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(110% 80% at 82% 4%,rgba(24,50,78,.5),transparent 56%),
             radial-gradient(80% 70% at 4% 104%,rgba(14,34,54,.5),transparent 62%),
             linear-gradient(180deg,#080b0f,#05070a)}
.beam,.glow,.kanji,.ring{position:absolute;left:var(--cx);top:var(--cy);opacity:0}
.beam{top:0;width:calc(var(--r)*3.4);height:calc(var(--cy) + var(--r)*.5);transform:translateX(-50%);filter:blur(26px);transition:opacity 2.6s .2s}
.beam::before{content:"";position:absolute;inset:0;clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(255,243,230,.1),rgba(255,243,230,.03) 70%,transparent)}
.glow{width:calc(var(--r)*5.4);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,224,204,.13),rgba(242,137,92,.06) 40%,rgba(10,22,36,0) 72%);transition:opacity 2s .1s}
.kanji{font:800 calc(var(--r)*3.15)/1 var(--display);transform:translate(-50%,-53%);user-select:none;white-space:nowrap;
  background:radial-gradient(circle at var(--lx) var(--ly),#3a6a96 0,#1d3c5c 28%,#112235 60%,#0c1825 82%);
  -webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity 2.8s .35s}
.ring{width:calc(var(--r)*2.62);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(201,231,251,.11)}
.ring i{position:absolute;inset:-4px;border-radius:50%;animation:orbit 34s linear infinite}
.ring i::after{content:"";position:absolute;left:50%;top:0;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--salmon);box-shadow:0 0 16px 3px rgba(242,137,92,.5)}
@keyframes orbit{to{transform:rotate(1turn)}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 78% 82% at 58% 50%,transparent 50%,rgba(0,0,0,.62) 100%)}
.go .beam{opacity:.8}.go .glow,.go .kanji{opacity:1}

#gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.1s .15s}
.go #gl{opacity:1}
.still{position:fixed;z-index:1;left:var(--cx);top:var(--cy);width:calc(var(--r)*2.15);transform:translate(-50%,-50%);animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
@keyframes bob{50%{transform:translate(-50%,-53%) rotate(-2deg)}}
.hit{position:fixed;left:0;top:0;z-index:3;border-radius:50%;cursor:pointer;touch-action:none}
.nogl .hit,.nogl .layers{display:none}

/* ——— anatomia ——— */
.lines{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.lines path{fill:none;stroke:rgba(238,241,244,.5);stroke-width:1}
.lines circle{fill:#f6efe6}
.labs{position:fixed;inset:0;z-index:2;pointer-events:none}
.lab{position:absolute;left:0;top:0;opacity:0;white-space:nowrap;will-change:transform,opacity}
.lab b{display:block;font:500 17px/1.15 var(--sans);color:#f6f3ee}
.lab span{display:block;margin-top:4px;font:500 13px/1.1 var(--display);letter-spacing:.08em;color:var(--faint)}

/* ——— interface ——— */
.ui{position:fixed;inset:0;z-index:4;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,43fr) minmax(0,57fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:clamp(16px,3vw,48px);
  padding:max(24px,env(safe-area-inset-top)) var(--pad-x) max(26px,env(safe-area-inset-bottom))}
.ui a,.ui button{pointer-events:auto}
.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;color:var(--ice)}
.brand svg{display:block;fill:currentColor;width:auto}
.brand .ico{height:42px}.brand .word{height:15px}
.mini{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(201,231,251,.22);font:500 14px/1 var(--sans);transition:background .3s,border-color .3s}
.mini:hover{background:rgba(201,231,251,.08);border-color:rgba(201,231,251,.45)}
.mini svg,.cta svg,.layers svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.mini svg{width:15px;height:15px;stroke-width:1.8}
.copy{grid-column:1;grid-row:2;align-self:center;padding-bottom:3vh}
.kicker{margin:0;display:flex;align-items:center;gap:12px;font:500 15px/1 var(--sans);color:var(--ice)}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--salmon);box-shadow:0 0 12px rgba(242,137,92,.75)}
.kicker span{font:500 13px/1 var(--display);letter-spacing:.24em;color:var(--faint)}
.title{margin:20px 0 0;font:500 clamp(44px,5.5vw,92px)/1.02 var(--display);letter-spacing:-.018em;color:#f4f1ec}
.ln{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.ln>span{display:inline-block;transform:translateY(112%);transition:transform 1.25s var(--d,0s) cubic-bezier(.2,.75,.1,1)}
.go .ln>span{transform:none}
.lede{margin:26px 0 0;max-width:36ch;font-size:17px;line-height:1.62;color:var(--mute)}
.act{margin-top:34px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.cta{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:22px;height:62px;padding:0 10px 0 30px;border-radius:999px;
  background:var(--ice);color:var(--ice-ink);font:700 17px/1 var(--sans);letter-spacing:.01em;
  box-shadow:0 14px 44px -14px rgba(150,210,250,.55),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .4s cubic-bezier(.2,.7,.1,1),box-shadow .4s}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-130%);animation:sheen 6s 3.4s ease-in-out infinite}
@keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cta i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ice-ink);color:var(--ice)}
.cta svg{width:20px;height:20px;stroke-width:2;transition:transform .4s cubic-bezier(.2,.7,.1,1)}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 54px -14px rgba(150,210,250,.7),inset 0 1px 0 rgba(255,255,255,.7)}
.cta:hover svg{transform:translateX(3px)}
.cta:active{transform:translateY(0) scale(.985)}
.note{margin:0 0 0 6px;font-size:13px;color:var(--faint)}
.stage{grid-column:2;grid-row:1/4}
.layers{grid-column:2;grid-row:3;justify-self:end;align-self:end;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 14px;border-radius:999px;
  border:1px solid rgba(201,231,251,.2);background:rgba(8,13,20,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font:500 14px/1 var(--sans);cursor:pointer;transition:background .3s,border-color .3s}
.layers svg{width:18px;height:18px;stroke-width:1.6}
.layers:hover,.layers[aria-pressed=true]{background:rgba(201,231,251,.1);border-color:rgba(201,231,251,.42)}
:focus-visible{outline:2px solid var(--ice);outline-offset:4px}
.tate{position:fixed;z-index:4;right:max(24px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);writing-mode:vertical-rl;display:flex;align-items:center;gap:18px;font:500 13px/1 var(--display);letter-spacing:.5em;color:rgba(238,241,244,.34);pointer-events:none}
.anat .tate{opacity:0!important;transition:opacity .5s 0s!important}
.tate::before,.tate::after{content:"";width:1px;height:54px;background:rgba(238,241,244,.16)}
.grain{position:fixed;inset:-60px;z-index:9;pointer-events:none;opacity:.05;animation:grain 1.4s steps(5) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 9 -4.2 0 0 0 9 -4.2 0 0 0 9 -4.2 0 0 0 0 .9'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{20%{transform:translate(-22px,14px)}40%{transform:translate(18px,-26px)}60%{transform:translate(-10px,-12px)}80%{transform:translate(26px,20px)}}

/* entrada */
.fx{opacity:0;transform:translateY(14px);transition:opacity 1s var(--d,0s) cubic-bezier(.2,.7,.1,1),transform 1s var(--d,0s) cubic-bezier(.2,.7,.1,1)}
.tate.fx{transform:translateY(-50%)}
.go .fx{opacity:1;transform:none}.go .tate.fx{transform:translateY(-50%)}

/* celular e telas em pé */
@media (max-aspect-ratio:21/20),(max-width:600px){
  .ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
    padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  .copy{display:contents}
  .head{grid-row:2;padding-top:clamp(12px,3.2vh,34px)}
  .foot{grid-row:4}
  .stage{grid-column:1;grid-row:3}
  .layers{grid-column:1;grid-row:3;margin-bottom:4px;height:44px;font-size:13px;padding:0 14px 0 12px}
  .brand .ico{height:34px}.brand .word{height:12.5px}.brand{gap:11px}
  .mini{height:44px;padding:0 15px;font-size:13px}
  .mini .long{display:none}
  .kicker{font-size:14px}
  .title{margin-top:14px;font-size:clamp(34px,10.6vw,56px);line-height:1.04}
  .lede{margin-top:0;font-size:15.5px;line-height:1.55;max-width:40ch}
  .act{margin-top:16px;gap:10px;align-items:stretch}
  .cta{height:60px;justify-content:space-between;padding-left:26px}
  .note{text-align:center;margin:0}
  .tate{display:none}
  .lab b{font-size:15px}.lab span{font-size:12px}
}
@media (max-aspect-ratio:21/20) and (max-height:700px),(max-width:600px) and (max-height:700px){
  .lede br{display:none}.title{font-size:clamp(30px,9.4vw,44px)}.note{display:none}
}
@media (min-aspect-ratio:21/20) and (max-height:560px){
  .title{font-size:clamp(30px,6.4vh,52px);margin-top:12px}.lede{display:none}.act{margin-top:18px}.cta{height:52px}.brand .ico{height:32px}
}
@media (prefers-reduced-motion:reduce){
  .fx,.ln>span,.beam,.glow,.kanji,.ring,#gl{transition-duration:.01s!important;transition-delay:0s!important}
  .ring i,.cta::before,.grain{animation:none}
}
</style>
<noscript><style>.fx,.ln>span{opacity:1!important;transform:none!important}.layers{display:none}</style></noscript>
</head>

</div>

<canvas id="gl" aria-hidden="true"></canvas>

</svg>

</div>

  if (e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0; drag.max = Math.max(drag.max, Math.hypot(dx, dy));
  if (e.pointerType !== 'mouse') { ptr.tx = clamp(dx / (W * .3), -1.7, 1.7); ptr.ty = clamp(dy / (H * .26), -1.3, 1.3); }
});
const release = e => {
  if (e.pointerId !== drag.id) return;
  const now = performance.now(); drag.id = null;
  if (drag.max < 10 && now - drag.t0 < 450) setOpen(!open, 'user', now);
  if (e.pointerType !== 'mouse') { ptr.tx = 0; ptr.ty = 0; }
  nextAuto = Math.max(nextAuto, now + 14000);
};
hit.addEventListener('pointerup', release); hit.addEventListener('pointercancel', release);
if (matchMedia('(hover: none)').matches) addEventListener('deviceorientation', e => {
  if (drag.id !== null || e.gamma == null) return;
  ptr.tx = clamp(e.gamma / 32, -1, 1); ptr.ty = clamp((e.beta - 42) / 32, -1, 1);
}, { passive: true });
addEventListener('resize', layout);
MQ.addEventListener('change', layout);

/* ——— carga ——— */
const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1600))]);
Promise.all(['color', 'mask', 'rice', 'salmon', 'cheese', 'nori'].map(k => load(DATA[k]).then(im => [k, im]))).then(async list => {
  const img = Object.fromEntries(list);
  await fontsReady;
  try { initGL(img); } catch (err) { console.warn(err); fallback(img); }
  layout();
  T0 = last = performance.now();
  if (RM) E = eTo = 0; else { eFrom = 1; eTo = 0; eT0 = T0 + 220; eDur = 2250; }
  requestAnimationFrame(() => body.classList.add('go'));
  if (gl) requestAnimationFrame(frame);
}).catch(err => { console.warn(err); body.classList.add('go', 'nogl'); });
layout();
}
